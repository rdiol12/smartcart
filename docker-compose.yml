# Local development stack only. Do NOT deploy this compose file to a
# public server as-is: it exposes the postgres port directly to the host
# (15432), publishes pgadmin on 8080 with credentials from .env, and the
# server reads its config from ./server/.env. Production deployments
# should use a managed Postgres + their own server runtime (Render,
# Railway, etc.) and not run this file.

services:
  postgres:
    image: postgres:16-alpine
    container_name: smartcart-db
    restart: unless-stopped
    ports:
      - "15432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Folder mount with init scripts (postgres runs every *.sql in here
      # on first start). Renamed from `database_schema.sql/` so the path
      # actually looks like a folder.
      - ./server/db_init:/docker-entrypoint-initdb.d/
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: smartcart-pgadmin
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
      PGADMIN_CONFIG_SERVER_MODE: "true"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - postgres

  server:
    build: ./server
    container_name: smartcart-server
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - ./server/.env
    environment:
      # Overrides server/.env's host-mode DATABASE_URL.
      # Inside the compose network the DB is reachable as `postgres:5432`.
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
    volumes:
      - server_prices:/app/my_prices
    depends_on:
      postgres:
        condition: service_healthy

  front:
    build:
      context: ./frontend
      args:
        # Empty string → root-relative requests, proxied to server by nginx.
        VITE_API_URL: ${VITE_API_URL-}
    container_name: smartcart_front
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - server

volumes:
  postgres_data:
  pgadmin_data:
  server_prices:
